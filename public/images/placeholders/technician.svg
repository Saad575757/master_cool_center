<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Technician portrait placeholder">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0a2455"/>
      <stop offset="55%" stop-color="#10409b"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>
    <linearGradient id="poverall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c63e0"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="paccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef3b4a"/>
      <stop offset="100%" stop-color="#a30f1c"/>
    </linearGradient>
    <radialGradient id="pglow" cx="50%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#4183ef" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4183ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#pbg)"/>
  <rect width="1200" height="1500" fill="url(#pglow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 150h1200M0 330h1200M0 510h1200M0 690h1200M0 870h1200M0 1050h1200M0 1230h1200"/>
    <path d="M160 0v1500M440 0v1500M720 0v1500M1000 0v1500"/>
  </g>

  <!-- toolbox -->
  <g transform="translate(80 1050)">
    <rect width="330" height="230" rx="18" fill="#0a1830"/>
    <rect x="0" y="0" width="330" height="60" rx="18" fill="#122346"/>
    <rect x="120" y="96" width="90" height="20" rx="10" fill="#2b4370"/>
    <rect x="24" y="96" width="60" height="14" rx="7" fill="#e01b2d"/>
    <rect x="24" y="128" width="60" height="14" rx="7" fill="#4183ef"/>
    <rect x="200" y="96" width="106" height="14" rx="7" fill="#2b4370"/>
  </g>

  <!-- technician -->
  <g transform="translate(340 0)">
    <path d="M40 1500c0-268 108-424 260-424s262 156 262 424z" fill="url(#poverall)"/>
    <path d="M300 1076c-14 140-14 282 0 424h-104c-32-158-32-284 0-424z" fill="#050d1c" opacity="0.45"/>
    <!-- chest stripe -->
    <path d="M188 1104h224l-30 120H218z" fill="#0a1830" opacity="0.35"/>
    <!-- collar -->
    <path d="M222 1078h156l-78 78z" fill="url(#paccent)"/>
    <!-- pocket + tool -->
    <rect x="256" y="1272" width="88" height="86" rx="10" fill="#0a1830" opacity="0.4"/>
    <rect x="284" y="1210" width="30" height="70" rx="12" fill="#c3cedd"/>
    <!-- head + neck -->
    <rect x="238" y="962" width="124" height="130" rx="40" fill="#d99f78"/>
    <circle cx="300" cy="852" r="142" fill="#e8b48c"/>
    <!-- ears -->
    <circle cx="162" cy="864" r="26" fill="#e8b48c"/>
    <circle cx="438" cy="864" r="26" fill="#e8b48c"/>
    <!-- hair -->
    <path d="M158 828a142 142 0 0 1 284 0 160 160 0 0 0-284 0z" fill="#241610"/>
    <!-- helmet -->
    <path d="M140 812a160 160 0 0 1 320 0z" fill="url(#paccent)"/>
    <rect x="118" y="804" width="364" height="32" rx="16" fill="#c41424"/>
    <rect x="424" y="768" width="86" height="72" rx="16" fill="#ef3b4a"/>
    <path d="M470 782h40v44h-40z" fill="#ffffff" opacity="0.35"/>
    <!-- face -->
    <g fill="#3a2418">
      <rect x="234" y="846" width="46" height="12" rx="6"/>
      <rect x="320" y="846" width="46" height="12" rx="6"/>
    </g>
    <path d="M262 928q38 26 76 0" stroke="#3a2418" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M300 866v42h-18" stroke="#c99a76" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- beard -->
    <path d="M212 916a88 88 0 0 0 176 0 118 118 0 0 1-176 0z" fill="#3a2418" opacity="0.35"/>
  </g>

  <!-- gauge -->
  <g transform="translate(910 250)">
    <circle cx="100" cy="100" r="96" fill="#ffffff" opacity="0.96"/>
    <circle cx="100" cy="100" r="74" fill="none" stroke="#dde4ee" stroke-width="14"/>
    <path d="M100 100 148 58" stroke="#e01b2d" stroke-width="12" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="14" fill="#0a1830"/>
    <path d="M100 100 62 44" stroke="#0a1830" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <rect x="88" y="200" width="24" height="80" rx="12" fill="#0a2455"/>
  </g>
</svg>
