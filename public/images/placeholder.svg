<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Master Cool Center service image placeholder">
  <defs>
    <linearGradient id="pb" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a2455"/>
      <stop offset="55%" stop-color="#10409b"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>
    <linearGradient id="pu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe3ee"/>
